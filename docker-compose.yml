
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager_local_only
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports: ["4566:4566"]
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-queues.sh:ro"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build: .
    env_file: .env
    command: ["bun", "scripts/migrate.ts", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["bun", "src/worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    restart: unless-stopped

  publisher:
    build: .
    env_file: .env
    command: ["bun", "src/outbox-publisher.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
